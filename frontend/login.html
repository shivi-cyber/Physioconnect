<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | PhysioConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main id="main" class="container">
    <div class="auth-wrap">
      <h1 style="font-size:2rem">Welcome</h1>
      <p class="muted">Log in to book and manage your appointments.</p>
      <div id="notice"></div>

      <div class="card">
        <div class="tabs" role="tablist" aria-label="Account">
          <button class="tab" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true" type="button">Log in</button>
          <button class="tab" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" type="button">Create account</button>
        </div>

        <div id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <form id="form-login" novalidate>
          <div id="login-error"></div>
          <div class="field"><label for="l-id">Email or phone number</label><input class="input" id="l-id" name="email" autocomplete="username" required></div>
          <div class="field"><label for="l-pw">Password</label><input class="input" id="l-pw" name="password" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>
        </div>

        <div id="panel-register" role="tabpanel" aria-labelledby="tab-register" class="hidden">
        <form id="form-register" novalidate>
          <div id="register-error"></div>
          <div class="form-grid">
            <div class="field"><label for="r-first">First name</label><input class="input" id="r-first" name="first_name" autocomplete="given-name" required></div>
            <div class="field"><label for="r-last">Last name</label><input class="input" id="r-last" name="last_name" autocomplete="family-name" required></div>
          </div>
          <div class="field"><label for="r-email">Email</label><input class="input" id="r-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="r-phone">Phone number <span class="muted">(optional)</span></label><input class="input" id="r-phone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="field"><label for="r-pw">Password</label><input class="input" id="r-pw" name="password" type="password" autocomplete="new-password" required aria-describedby="r-pw-hint"><span class="hint" id="r-pw-hint">At least 8 characters.</span></div>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
        </div>
      </div>

      <!-- Demo accounts: handy while testing. Delete this block before going live. -->
      <details class="demo">
        <summary>Demo accounts (for testing)</summary>
        <div class="demo-list" id="demo-list"></div>
        <p class="hint" style="margin:12px 0 0">Click one to fill the form. Password for all: Demo@12345</p>
      </details>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
