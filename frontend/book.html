<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an appointment | PhysioConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main id="main" class="container section-tight">
    <h1 id="page-title" style="font-size:2.2rem">Book an appointment</h1>
    <p id="page-lead" class="lead" style="margin-bottom:24px">Choose a service, a doctor and a time. It takes about a minute.</p>
    <ol class="stepper" id="stepper" aria-label="Booking steps"></ol>
    <div id="notice"></div>
    <div id="flow" class="stack"></div>
    <div id="done" class="hidden"></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
